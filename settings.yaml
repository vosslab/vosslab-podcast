    candidate_count: 3
    reviewer_count: 3
    max_parallel_calls: 6
    max_route_calls: 42
    route_retry_attempts: 1
  repository_outline:
    generator_count: 2
    merger_count: 2
    reviewer_count: 1
    maximum_parallel_calls: 6
    route_retry_attempts: 1
    routes:
      generator:
        name: "repository_outline_generator"
        command: ["hermes", "chat", "--provider", "openai-codex", "--query-file", "-", "--ignore-rules", "--quiet"]
      merger:
        name: "repository_outline_merger"
        command: ["hermes", "chat", "--provider", "openai-codex", "--query-file", "-", "--ignore-rules", "--quiet"]
      reviewer:
        name: "repository_outline_reviewer"
        command: ["hermes", "chat", "--provider", "openai-codex", "--query-file", "-", "--ignore-rules", "--quiet"]
    prompt_limits:
      generator_chars: 48000
      merger_chars: 64000
      reviewer_chars: 72000
