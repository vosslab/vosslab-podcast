github:
  username: vosslab
  identity_login: vosslab
  allowed_emails: []
  timezone: America/Chicago
  #username: Febbu
  token: ""

llm:
  max_tokens: 1200
  repo_limit: 0
  depth: 1
  providers:
    apple:
      enabled: true
    ollama:
      enabled: false
      models:
        - name: "qwen2.5:7b"
          enabled: true
        - name: "llama3.2:3b"
          enabled: false

tts:
  say:
    voice: "Siri"
    rate_wpm: 185

daily_blog:
  repository_path: "/home/vosslab/nsh/vosslab-daily-blog"
  mirror_cache_root: "/home/vosslab/repo-mirrors/vosslab"
  report_timezone: "America/Chicago"
  schedule_start_date: "2026-08-26"
  repository_urls: []
  identity_names:
    - "Dr. Neil R Voss"
  identity_emails:
    - "vosslab@users.noreply.github.com"
  shadow_evaluation:
    # Historical post text and exact-Git evidence cross the configured model route only by opt-in.
    external_model_data_sharing: false
  routes:
    authors:
      - name: "author_one"
        command:
          - "hermes"
          - "chat"
          - "--in"
          - "{generator_repository}"
          - "--query-file"
          - "-"
          - "--ignore-rules"
          - "--quiet"
      - name: "author_two"
        command:
          - "hermes"
          - "chat"
          - "--in"
          - "{generator_repository}"
          - "--query-file"
          - "-"
          - "--ignore-rules"
          - "--quiet"
    referee:
      name: "referee"
      command:
        - "hermes"
        - "chat"
        - "--in"
        - "{generator_repository}"
        - "--query-file"
        - "-"
        - "--ignore-rules"
        - "--quiet"
  collection_limits:
    changed_documentation_chars: 16000
    diff_chars: 24000
    readme_context_chars: 6000
    commit_metadata_chars: 6000
    per_item_chars: 8000
    supporting_total_chars: 48000
    screenshot_count: 12
  projection_limits:
    context_chars: 60000
    excerpt_chars: 6000
    commit_subject_chars: 480
  prompt_limits:
    author_chars: 72000
    referee_chars: 88000
