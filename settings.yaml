github:
  username: vosslab
  identity_login: vosslab
  allowed_emails: []
  timezone: America/Chicago
  #username: Febbu

llm:
  max_tokens: 1200
  repo_limit: 0
  depth: 1
  providers:
    apple:
      enabled: true
    ollama:
      enabled: false
      models:
        - name: "qwen2.5:7b"
          enabled: true
        - name: "llama3.2:3b"
          enabled: false

tts:
  say:
    voice: "Siri"
    rate_wpm: 185

daily_blog:
  repository_path: "/home/vosslab/nsh/vosslab-daily-blog"
  mirror_cache_root: "/home/vosslab/repo-mirrors"
  report_timezone: "America/Chicago"
  identity_names:
    - "Dr. Neil R Voss"
  identity_emails:
    - "vosslab@users.noreply.github.com"
  routes:
    authors:
      - name: "author_one"
        command:
          - "hermes"
          - "chat"
          - "--provider"
          - "openai-codex"
          - "--query-file"
          - "-"
          - "--ignore-rules"
          - "--quiet"
      - name: "author_two"
        command:
          - "hermes"
          - "chat"
          - "--provider"
          - "openai-codex"
          - "--query-file"
          - "-"
          - "--ignore-rules"
          - "--quiet"
    referee:
      name: "referee"
      command:
        - "hermes"
        - "chat"
        - "--provider"
        - "openai-codex"
        - "--query-file"
        - "-"
        - "--ignore-rules"
        - "--quiet"
